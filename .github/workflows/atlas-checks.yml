name: Hughes Atlas checks
on:
  push:
    branches: ["docs/repository-updates-2026-10-16"]
    paths:
      - "addons/hughes_atlas/**"
      - "tests/**"
      - "tools/**"
      - "project.godot"
      - ".github/workflows/atlas-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Data and regression checks
        run: |
          python3 tools/atlas_data.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install exact Godot 4.7.2 test engine
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-atlas"
          cd "$RUNNER_TEMP/godot-atlas"
          curl -fL --retry 2 -o godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          echo "$RUNNER_TEMP/godot-atlas" >> "$GITHUB_PATH"
      - name: Native editor import
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          timeout 90 godot --headless --editor --path . --import 2>&1 | tee /tmp/atlas-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/atlas-import.log; then exit 1; fi
      - name: Native model and UI callback smoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path . --script tests/atlas_smoke.gd 2>&1 | tee /tmp/atlas-smoke.log
          grep -F 'Hughes Atlas native smoke: PASS' /tmp/atlas-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|ERROR:' /tmp/atlas-smoke.log; then exit 1; fi
